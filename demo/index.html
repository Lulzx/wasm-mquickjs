<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQUICKJS // WASM EXECUTION MATRIX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-panel: #0d0d0d;
            --border-harsh: #2a2a2a;
            --border-active: #3d3d3d;
            --text-primary: #c8c8c8;
            --text-dim: #666666;
            --text-label: #888888;
            --accent-green: #00ff41;
            --accent-green-dim: #00aa2a;
            --accent-amber: #ffaa00;
            --accent-amber-dim: #996600;
            --accent-red: #ff2a2a;
            --accent-red-dim: #aa1a1a;
            --accent-cyan: #00d4ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* Scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.15) 2px,
                rgba(0, 0, 0, 0.15) 4px
            );
            z-index: 9999;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 12px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header - Industrial control panel style */
        header {
            background: var(--bg-secondary);
            border: 2px solid var(--border-harsh);
            border-bottom: 3px solid var(--border-harsh);
            padding: 0;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-bottom: 1px solid var(--border-harsh);
            background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .system-id {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 2px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-light {
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green), inset 0 0 3px rgba(255,255,255,0.3);
            animation: pulse-light 2s ease-in-out infinite;
        }

        @keyframes pulse-light {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-text {
            font-size: 0.65rem;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-primary);
            padding: 10px 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: var(--bg-panel);
        }

        h1 span {
            color: var(--accent-cyan);
        }

        .header-meta {
            display: flex;
            gap: 16px;
            padding: 6px 12px;
            background: var(--bg-primary);
            font-size: 0.65rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border-harsh);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-label {
            color: var(--text-label);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-value {
            color: var(--accent-amber);
            font-weight: 700;
        }

        /* Stats Grid - Industrial gauges */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            margin-bottom: 10px;
            background: var(--border-harsh);
            border: 2px solid var(--border-harsh);
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 10px 12px;
            position: relative;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-green);
        }

        .stat-card.memory::before { background: var(--accent-cyan); }
        .stat-card.speed::before { background: var(--accent-amber); }
        .stat-card.dead::before { background: var(--accent-red); }

        .stat-label {
            font-size: 0.55rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            font-weight: 400;
            color: var(--accent-green);
            line-height: 1;
            text-shadow: 0 0 10px currentColor;
        }

        .stat-card.memory .stat-value { color: var(--accent-cyan); }
        .stat-card.speed .stat-value { color: var(--accent-amber); }
        .stat-card.dead .stat-value { color: var(--accent-red); }

        /* Control buttons - Industrial switches */
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            background: var(--border-harsh);
            border: 2px solid var(--border-harsh);
            padding: 2px;
            margin-bottom: 10px;
        }

        button {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 10px 12px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.1s ease;
            position: relative;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-spawn {
            background: var(--bg-secondary);
            color: var(--accent-green);
            border-left: 3px solid var(--accent-green);
        }

        .btn-spawn:hover:not(:disabled) {
            background: #0f1a0f;
            box-shadow: inset 0 0 20px rgba(0, 255, 65, 0.1);
        }

        .btn-kill {
            background: var(--bg-secondary);
            color: var(--accent-amber);
            border-left: 3px solid var(--accent-amber);
        }

        .btn-kill:hover:not(:disabled) {
            background: #1a150a;
            box-shadow: inset 0 0 20px rgba(255, 170, 0, 0.1);
        }

        .btn-infinite {
            background: var(--bg-secondary);
            color: var(--accent-red);
            border-left: 3px solid var(--accent-red);
        }

        .btn-infinite:hover:not(:disabled) {
            background: #1a0a0a;
            box-shadow: inset 0 0 20px rgba(255, 42, 42, 0.1);
        }

        .btn-reset {
            background: var(--bg-secondary);
            color: var(--text-dim);
            border-left: 3px solid var(--border-active);
        }

        .btn-reset:hover:not(:disabled) {
            background: #151515;
            color: var(--text-primary);
        }

        /* Alert message */
        .message {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-red);
            border-left: 4px solid var(--accent-red);
            padding: 8px 12px;
            margin-bottom: 10px;
            display: none;
            font-size: 0.65rem;
        }

        .message.show {
            display: flex;
            align-items: center;
            gap: 10px;
            animation: alert-flash 0.5s ease;
        }

        @keyframes alert-flash {
            0%, 50% { background: rgba(255, 42, 42, 0.15); }
            25%, 75% { background: var(--bg-secondary); }
        }

        .message-icon {
            font-size: 1rem;
            color: var(--accent-red);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .message-text strong {
            color: var(--accent-red);
            text-transform: uppercase;
        }

        .message-text em {
            color: var(--accent-green);
            font-style: normal;
        }

        /* Universe grid - Execution matrix */
        .universe-container {
            background: var(--bg-secondary);
            border: 2px solid var(--border-harsh);
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .universe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            padding: 6px 10px;
            border-bottom: 2px solid var(--border-harsh);
            background: var(--bg-panel);
            flex-shrink: 0;
        }

        .universe-title {
            font-size: 0.55rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .universe-legend {
            display: flex;
            gap: 10px;
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
        }

        .legend-dot {
            width: 6px;
            height: 6px;
            border-radius: 1px;
        }

        .legend-dot.active {
            background: var(--accent-green);
            box-shadow: 0 0 4px var(--accent-green);
        }
        .legend-dot.computing {
            background: var(--accent-amber);
            box-shadow: 0 0 4px var(--accent-amber);
        }
        .legend-dot.dead {
            background: var(--accent-red-dim);
        }

        #universe {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            padding: 10px;
            background: var(--bg-panel);
            flex: 1;
            align-content: start;
        }

        .dot {
            aspect-ratio: 1;
            background: var(--accent-green-dim);
            border-radius: 2px;
        }

        .dot.empty {
            background: var(--border-harsh);
        }

        .dot.computing {
            background: var(--accent-amber);
        }

        .dot.dead {
            background: #331111;
        }

        .loading {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Footer */
        footer {
            color: var(--text-dim);
            font-size: 0.55rem;
            padding: 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            flex-shrink: 0;
        }

        footer a {
            color: var(--accent-cyan);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .container {
                padding: 8px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <div class="system-id">SYS://MQUICKJS-WASM/EXECUTION-MATRIX/v1.0</div>
                <div class="status-indicator">
                    <div class="status-light"></div>
                    <span class="status-text">Online</span>
                </div>
            </div>
            <h1>PARALLEL <span>//</span> JS EXECUTION</h1>
            <div class="header-meta">
                <div class="meta-item">
                    <span class="meta-label">Binary:</span>
                    <span class="meta-value">165 KB</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Heap/Instance:</span>
                    <span class="meta-value">32 KB</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Isolation:</span>
                    <span class="meta-value">COMPLETE</span>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="instanceCount">0</div>
            </div>
            <div class="stat-card memory">
                <div class="stat-label">Memory</div>
                <div class="stat-value" id="totalMemory">0 MB</div>
            </div>
            <div class="stat-card speed">
                <div class="stat-label">Evals/s</div>
                <div class="stat-value" id="execSpeed">0</div>
            </div>
            <div class="stat-card dead">
                <div class="stat-label">Crashed</div>
                <div class="stat-value" id="deadCount">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-spawn" id="btnSpawn" onclick="spawn(1)">+ SPAWN</button>
            <button class="btn-kill" onclick="killRandom()">KILL</button>
            <button class="btn-infinite" onclick="injectInfiniteLoop()" title="Spacebar">! FAULT</button>
            <button class="btn-reset" onclick="reset()">RESET</button>
        </div>

        <div class="message" id="message">
            <div class="message-icon">!</div>
            <div class="message-text">
                <strong>FAULT</strong> — <em><span id="survivorCount">119</span> unaffected.</em>
            </div>
        </div>

        <div class="universe-container">
            <div class="universe-header">
                <span class="universe-title">1 Cell = 1 JS Runtime</span>
                <span id="progressText">0 / 124</span>
            </div>
            <div id="universe"></div>
        </div>

        <footer>
            <a href="https://bellard.org/quickjs/mquickjs/">MicroQuickJS</a> // 165KB WASM
        </footer>
    </div>

    <script>
        // Configuration
        // Chrome limits ~124 WASM instances due to virtual address space
        const INITIAL_COUNT = 100; // Start with 100, user can spawn 24 more
        const MAX_INSTANCES = 124; // Chrome limit
        const HEAP_SIZE = 32768; // 32KB per instance

        // State
        let wasmModule = null;
        let instances = [];
        let aliveInstances = []; // Cache for performance
        let deadPool = []; // Killed instances that can be revived
        let deadCount = 0;
        let totalEvals = 0;
        let lastEvalTime = performance.now();
        let evalRate = 0;
        let isSpawning = false;

        // DOM
        const universe = document.getElementById('universe');
        const instanceCountEl = document.getElementById('instanceCount');
        const totalMemoryEl = document.getElementById('totalMemory');
        const execSpeedEl = document.getElementById('execSpeed');
        const deadCountEl = document.getElementById('deadCount');
        const progressText = document.getElementById('progressText');
        const messageEl = document.getElementById('message');
        const btnSpawn = document.getElementById('btnSpawn');

        // Pre-encoded expressions for performance
        const encoder = new TextEncoder();
        const expressions = [
            '1 + 2 * 3',
            '10 * 10',
            '100 / 4',
            '(5 + 3) * 2',
            '99 - 42',
            '7 * 8',
            '2 ** 8',
            '10 > 5 ? 1 : 0',
            'Math.floor(Math.sqrt(144))',
            'Math.abs(-42)',
            'Math.max(1, 5, 3)',
            '[1, 2, 3].length',
            '({a: 1, b: 2}).a + ({a: 1, b: 2}).b',
        ].map(code => ({ bytes: encoder.encode(code), len: code.length }));

        // Create grid immediately on page load (show all slots)
        function initGrid() {
            universe.innerHTML = '';
            for (let i = 0; i < MAX_INSTANCES; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot empty';
                universe.appendChild(dot);
            }
        }

        async function loadWasm() {
            try {
                progressText.textContent = 'LOADING WASM...';
                const response = await fetch('../zig-out/bin/mquickjs.wasm?v=' + Date.now());

                progressText.textContent = 'COMPILING...';
                const bytes = await response.arrayBuffer();
                wasmModule = await WebAssembly.compile(bytes);

                // Start execution loop immediately
                requestAnimationFrame(executionLoop);

                // Spawn instances into slots (runs in parallel with execution)
                spawnBatch(INITIAL_COUNT);
            } catch (e) {
                universe.innerHTML = `<div class="loading" style="color: var(--accent-red);">
                    WASM LOAD FAILED: ${e.message}<br><br>
                    <small style="color: var(--text-dim);">Run: zig build -Doptimize=ReleaseSmall</small>
                </div>`;
            }
        }

        function reviveInstance() {
            // Try to revive from dead pool first
            if (deadPool.length > 0) {
                const inst = deadPool.pop();
                // Re-init the JS context
                try {
                    inst.exports.mqjs_free();
                } catch(e) {}
                const result = inst.exports.mqjs_init(HEAP_SIZE);
                if (result === 0) {
                    inst.alive = true;
                    inst.memView = new Uint8Array(inst.memory.buffer);
                    return inst;
                }
            }
            return null;
        }

        async function createInstance() {
            // First try to revive a dead instance
            const revived = reviveInstance();
            if (revived) return revived;

            // Otherwise create new
            try {
                const instance = await WebAssembly.instantiate(wasmModule, {});
                const exports = instance.exports;

                // Log memory size on first instance
                if (instances.length === 0) {
                    const memPages = exports.memory.buffer.byteLength / 65536;
                    console.log(`WASM memory: ${memPages} pages (${(memPages * 64)}KB per instance)`);
                }

                const result = exports.mqjs_init(HEAP_SIZE);
                if (result !== 0) return null;

                return {
                    exports,
                    memory: exports.memory,
                    memView: new Uint8Array(exports.memory.buffer), // Cache view
                    alive: true,
                    element: null
                };
            } catch (e) {
                console.error('Failed at instance', instances.length, e.message);
                return null;
            }
        }

        async function spawnBatch(count) {
            if (isSpawning) return;
            isSpawning = true;
            btnSpawn.disabled = true;

            try {
                let spawned = 0;
                let failed = 0;

                for (let i = 0; i < count && failed < 20; i += 5) {
                    const batch = Math.min(5, count - i);

                    for (let j = 0; j < batch; j++) {
                        // Get random empty slot
                        const emptySlots = Array.from(universe.querySelectorAll('.dot.empty'));
                        if (emptySlots.length === 0) break;

                        const inst = await createInstance();
                        if (inst) {
                            // Pick random empty slot
                            const slotIdx = (Math.random() * emptySlots.length) | 0;
                            const slot = emptySlots[slotIdx];
                            slot.className = 'dot';
                            inst.element = slot;

                            instances.push(inst);
                            aliveInstances.push(inst);
                            spawned++;
                            failed = 0;
                        } else {
                            failed++;
                            await new Promise(r => setTimeout(r, 50));
                        }
                    }

                    progressText.textContent = `${aliveInstances.length} / ${MAX_INSTANCES}`;
                    instanceCountEl.textContent = aliveInstances.length;
                    totalMemoryEl.textContent = (aliveInstances.length * HEAP_SIZE / 1048576).toFixed(1) + ' MB';

                    await new Promise(r => setTimeout(r, 1));
                }
            } finally {
                isSpawning = false;
                btnSpawn.disabled = false;
                updateStats();
            }
        }

        async function spawn(count) {
            // Check based on alive instances (allow spawning after killing)
            const remaining = MAX_INSTANCES - aliveInstances.length;
            if (remaining <= 0) {
                btnSpawn.disabled = true;
                btnSpawn.textContent = 'AT LIMIT';
                return;
            }
            await spawnBatch(Math.min(count, remaining));

            // Update button state based on current alive count
            if (aliveInstances.length >= MAX_INSTANCES) {
                btnSpawn.disabled = true;
                btnSpawn.textContent = 'AT LIMIT';
            } else {
                btnSpawn.disabled = false;
                btnSpawn.textContent = '+ SPAWN';
            }
        }

        function killRandom(count = 1) {
            const toKill = Math.min(count, aliveInstances.length);
            for (let i = 0; i < toKill; i++) {
                const idx = (Math.random() * aliveInstances.length) | 0;
                const inst = aliveInstances[idx];
                inst.alive = false;
                inst.element.className = 'dot empty'; // Back to empty slot
                deadPool.push(inst); // Add to pool for reuse
                deadCount++;
                aliveInstances.splice(idx, 1);
            }
            updateStats();
            // Re-enable spawn if below limit
            if (aliveInstances.length < MAX_INSTANCES) {
                btnSpawn.disabled = false;
                btnSpawn.textContent = '+ SPAWN';
            }
        }

        function injectInfiniteLoop() {
            if (aliveInstances.length === 0) return;
            const idx = (Math.random() * aliveInstances.length) | 0;
            const victim = aliveInstances[idx];

            victim.element.className = 'dot computing';

            setTimeout(() => {
                victim.alive = false;
                victim.element.className = 'dot dead';
                deadPool.push(victim); // Add to pool for reuse
                deadCount++;
                aliveInstances.splice(aliveInstances.indexOf(victim), 1);

                document.getElementById('survivorCount').textContent = aliveInstances.length;
                messageEl.className = 'message show';
                setTimeout(() => messageEl.className = 'message', 4000);
                updateStats();
                // Re-enable spawn if below limit
                if (aliveInstances.length < MAX_INSTANCES) {
                    btnSpawn.disabled = false;
                    btnSpawn.textContent = '+ SPAWN';
                }
            }, 150);
        }

        function reset() {
            // Browser doesn't free WASM memory, so always reload for clean slate
            location.reload();
        }

        function evalInInstance(inst, expr) {
            inst.memView.set(expr.bytes, 200000);
            inst.memView[200000 + expr.len] = 0;
            return inst.exports.mqjs_eval(200000, expr.len);
        }

        let frameCount = 0;
        function executionLoop() {
            frameCount++;
            const len = aliveInstances.length;
            if (len === 0) {
                requestAnimationFrame(executionLoop);
                return;
            }

            const toExec = Math.min(100, len);
            const expLen = expressions.length;

            for (let i = 0; i < toExec; i++) {
                const inst = aliveInstances[(Math.random() * len) | 0];
                if (!inst) continue;

                try {
                    evalInInstance(inst, expressions[(Math.random() * expLen) | 0]);
                    totalEvals++;
                } catch (e) {
                    inst.alive = false;
                    inst.element.className = 'dot dead';
                    deadCount++;
                    const idx = aliveInstances.indexOf(inst);
                    if (idx > -1) aliveInstances.splice(idx, 1);
                }
            }

            // Visual feedback - flash random computing dots (batched)
            if (frameCount % 5 === 0 && len > 0) {
                const count = Math.min(3, len);
                for (let i = 0; i < count; i++) {
                    const inst = aliveInstances[(Math.random() * len) | 0];
                    if (inst && inst.element) {
                        inst.element.classList.add('computing');
                    }
                }
                // Clear all computing states after delay
                setTimeout(() => {
                    const computing = universe.querySelectorAll('.dot.computing');
                    computing.forEach(el => el.classList.remove('computing'));
                }, 60);
            }

            // Update stats every 30 frames
            if (frameCount % 30 === 0) {
                const now = performance.now();
                const elapsed = (now - lastEvalTime) / 1000;
                evalRate = Math.round(totalEvals / elapsed);
                lastEvalTime = now;
                totalEvals = 0;
                updateStats();
            }

            requestAnimationFrame(executionLoop);
        }

        function updateStats() {
            const alive = aliveInstances.length;
            instanceCountEl.textContent = alive;
            totalMemoryEl.textContent = (alive * HEAP_SIZE / 1048576).toFixed(1) + ' MB';
            execSpeedEl.textContent = evalRate;
            deadCountEl.textContent = deadCount;
            progressText.textContent = `${alive} / ${MAX_INSTANCES}`;
        }

        // Cleanup on page unload/refresh
        window.addEventListener('beforeunload', () => {
            for (const inst of aliveInstances) {
                try { inst.exports.mqjs_free(); } catch(e) {}
            }
            instances = [];
            aliveInstances = [];
        });

        // Pause execution when tab is hidden (save CPU)
        let isPageVisible = true;
        document.addEventListener('visibilitychange', () => {
            isPageVisible = !document.hidden;
        });

        // Modify execution loop to respect visibility
        const originalExecutionLoop = executionLoop;
        executionLoop = function() {
            if (!isPageVisible) {
                requestAnimationFrame(executionLoop);
                return;
            }
            originalExecutionLoop();
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                injectInfiniteLoop();
            } else if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) {
                reset();
            }
        });

        initGrid();
        loadWasm();
    </script>
</body>
</html>
